name: crazygames-upload
# Builds dist/ and uploads it to the CrazyGames Developer Portal as a new build (draft).
# Run it from the Actions tab ("Run workflow"). Needs repo secret CG_REFRESH_TOKEN.
# Sending the build for review/release is still done in the portal for now.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = login + list submissions; metrics = Basic Launch score + daily stats; dry = upload files, do not attach; upload = upload + attach as new build; qa-explore = open the portal QA tool on the newest build, screenshot each step, no submit; qa-submit = run the QA tool and submit; ship = upload, then qa-submit; art-status = list cover art versions (read-only); art-dry = check the new covers, no upload; art = upload media/covers-v2 as new cover art (CrazyGames reviews it, game builds unaffected)'
        type: choice
        options: [check, metrics, dry, upload, qa-explore, qa-submit, ship, art-status, art-dry, art]
        default: check
      notes:
        description: 'Update notes for qa-submit / ship'
        type: string
        default: 'Gameplay and UI improvements.'
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: crazygames-upload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Portal flow unchanged?
        run: node tools/cg_portal_check.mjs ${{ startsWith(inputs.mode, 'art') && '--art' || '' }}
      - name: Build dist
        if: inputs.mode == 'dry' || inputs.mode == 'upload' || inputs.mode == 'ship'
        run: bash tools/build_dist.sh
      - name: CrazyGames ${{ inputs.mode }}
        env:
          CG_REFRESH_TOKEN: ${{ secrets.CG_REFRESH_TOKEN }}
          CG_SUBMISSION_ID: ${{ vars.CG_SUBMISSION_ID }}
        run: |
          case "${{ inputs.mode }}" in
            check)  node tools/cg_upload.mjs check ;;
            metrics) node tools/cg_upload.mjs metrics --json cg-metrics.json ;;
            dry)    node tools/cg_upload.mjs upload dist --dry ;;
            upload|ship) node tools/cg_upload.mjs upload dist ;;
            art-status) node tools/cg_upload.mjs art-status --json cg-art.json ;;
            art-dry) node tools/cg_upload.mjs art media/covers-v2 --dry ;;
            art)    node tools/cg_upload.mjs art media/covers-v2 ;;
            *) echo "no upload step for ${{ inputs.mode }}" ;;
          esac
      - name: Install headless browser
        if: startsWith(inputs.mode, 'qa') || inputs.mode == 'ship'
        run: |
          npm i --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Portal QA tool + submit
        if: startsWith(inputs.mode, 'qa') || inputs.mode == 'ship'
        env:
          CG_REFRESH_TOKEN: ${{ secrets.CG_REFRESH_TOKEN }}
          CG_NOTES: ${{ inputs.notes }}
        run: node tools/cg_qa_bot.mjs ${{ inputs.mode == 'qa-explore' && 'explore' || 'submit' }}
      - name: Save QA screenshots
        if: always() && (startsWith(inputs.mode, 'qa') || inputs.mode == 'ship')
        uses: actions/upload-artifact@v4
        with:
          name: qa-shots
          path: qa-shots
      - name: Save metrics
        if: inputs.mode == 'metrics'
        uses: actions/upload-artifact@v4
        with:
          name: cg-metrics
          path: cg-metrics.json
      - name: Save art status
        if: startsWith(inputs.mode, 'art')
        uses: actions/upload-artifact@v4
        with:
          name: cg-art
          path: cg-art.json
          if-no-files-found: ignore
